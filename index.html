<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Revision Quiz 🌸</title>
  <!-- Loading external fonts and Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fira+Code:wght@500;600&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Fredoka', cursive, sans-serif;
      background: linear-gradient(135deg, #fef08a 0%, #fde047 50%, #eab308 100%);
      min-height: 100vh;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Falling Flowers Canvas */
    #flowerCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .app-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 820px;
    }

    /* Quiz Card */
    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12), 0 4px 12px rgba(0, 0, 0, 0.08);
      border: 4px solid #ca8a04;
      transition: all 0.3s ease;
    }

    .badge {
      background: #fef9c3;
      color: #854d0e;
      padding: 8px 16px;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 600;
      border: 2px solid #eab308;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .timer-badge {
      background: #fee2e2;
      color: #dc2626;
      border-color: #ef4444;
      font-size: 1.1rem;
      transition: all 0.3s ease;
    }

    .progress-bar-bg {
      width: 100%;
      height: 14px;
      background: #e2e8f0;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 24px;
      border: 2px solid #cbd5e1;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #059669);
      width: 0%;
      transition: width 0.4s ease;
    }

    /* Code Box */
    .code-box {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Fira Code', monospace;
      padding: 16px 20px;
      border-radius: 14px;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 20px;
      overflow-x: auto;
      border-left: 6px solid #eab308;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.3);
      white-space: pre;
    }

    /* Option Item Card */
    .option-item {
      display: flex;
      flex-direction: column;
      margin-bottom: 12px;
    }

    .option-btn {
      background: #f8fafc;
      border: 3px solid #cbd5e1;
      border-radius: 16px;
      padding: 14px 20px;
      font-size: 1.05rem;
      font-family: 'Fredoka', sans-serif;
      font-weight: 500;
      color: #334155;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
      outline: none;
      user-select: none;
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background: #f1f5f9;
      border-color: #ca8a04;
      transform: translateY(-2px);
    }

    .option-btn.selected {
      background: #fef9c3 !important;
      border-color: #ca8a04 !important;
      color: #854d0e !important;
      font-weight: 600;
    }

    .option-btn.correct {
      background: #dcfce7 !important;
      border-color: #22c55e !important;
      color: #15803d !important;
      font-weight: 600;
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }

    .option-btn.incorrect {
      background: #fee2e2 !important;
      border-color: #ef4444 !important;
      color: #b91c1c !important;
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }

    .option-btn.missed {
      background: #fef3c7 !important;
      border-color: #f59e0b !important;
      color: #92400e !important;
      font-weight: 600;
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }

    .option-btn:disabled {
      cursor: default;
    }

    /* Explanation Box Directly Under Button */
    .btn-explanation {
      display: none;
      padding: 12px 16px;
      border-bottom-left-radius: 16px;
      border-bottom-right-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.45;
      animation: fadeIn 0.25s ease-in-out;
    }

    .btn-explanation.correct-exp {
      background: #f0fdf4;
      border: 3px solid #22c55e;
      border-top: none;
      color: #14532d;
    }

    .btn-explanation.incorrect-exp {
      background: #fef2f2;
      border: 3px solid #ef4444;
      border-top: none;
      color: #7f1d1d;
    }

    .btn-explanation.missed-exp {
      background: #fffbeb;
      border: 3px solid #f59e0b;
      border-top: none;
      color: #78350f;
    }

    /* Handwritten Note Styling */
    .handwritten-note {
      background: #fffde7;
      background-image: linear-gradient(#e1f5fe 1px, transparent 1px);
      background-size: 100% 28px;
      border: 2px solid #fbc02d;
      border-radius: 16px;
      padding: 28px 24px;
      margin: 24px 0;
      text-align: left;
      box-shadow: 4px 8px 20px rgba(0, 0, 0, 0.08), -2px -2px 0px #fff;
      transform: rotate(-1deg);
      position: relative;
    }

    .handwritten-note::before {
      content: '📌';
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.8rem;
    }

    .note-content {
      font-family: 'Caveat', cursive;
      font-size: 1.65rem;
      color: #1a237e;
      line-height: 1.45;
    }

    .btn-action {
      background: linear-gradient(135deg, #ca8a04, #a16207);
      color: white;
      border: none;
      padding: 14px 36px;
      border-radius: 50px;
      font-size: 1.15rem;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(202, 138, 4, 0.4);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-action:hover {
      transform: scale(1.04);
      background: linear-gradient(135deg, #a16207, #854d0e);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      .card { padding: 20px; }
      .note-content { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

  <!-- Falling Flowers Canvas -->
  <canvas id="flowerCanvas"></canvas>

  <div class="app-container">
    <div class="card" id="quizCard">

      <!-- Home Landing Page -->
      <div class="text-center py-8" id="homeScreen">
        <h1 class="text-3xl md:text-5xl font-extrabold text-slate-900 mb-8">Python Revision Quiz</h1>
        <button class="btn-action text-xl px-12 py-4" onclick="startQuiz()">
          🚀 Start
        </button>
      </div>

      <!-- Quiz Header -->
      <div class="quiz-header flex justify-between items-center mb-5 flex-wrap gap-3" id="quizHeader" style="display: none;">
        <span class="badge" id="sectionBadge">Python Basics</span>
        <span class="badge" id="qCounter">Q 1 / 10</span>
        <span class="badge timer-badge" id="timerBadge">⏱️ 30s</span>
        <button class="bg-slate-100 hover:bg-slate-200 text-slate-700 border-2 border-slate-300 px-4 py-1.5 rounded-full text-sm font-semibold transition" onclick="showHomeScreen()">🏠 Home</button>
      </div>

      <!-- Progress Bar -->
      <div class="progress-bar-bg" id="progressBarBg" style="display: none;">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>

      <!-- Question Container -->
      <div id="questionContainer" style="display: none;">
        <div class="text-xs font-bold uppercase tracking-wider text-amber-700 mb-2" id="qTypeBadge">SINGLE CHOICE</div>
        <h2 class="text-xl md:text-2xl font-bold text-slate-900 mb-4 leading-snug" id="questionText">Loading question...</h2>
        <div id="codeContainer"></div>
        
        <div class="text-sm font-semibold text-slate-500 mb-3" id="instructionText">Select one option:</div>
        
        <!-- Options List -->
        <div id="optionsGrid"></div>

        <!-- Submit Button for Multi-Select -->
        <div class="flex justify-end mt-4 mb-2" id="multiSubmitContainer" style="display: none;">
          <button class="btn-action text-base px-8 py-3" id="submitMultiBtn" onclick="submitMultiAnswer()">
            ✅ Submit Selections
          </button>
        </div>
      </div>

      <!-- Controls -->
      <div class="flex justify-end mt-6" id="controlsContainer" style="display: none;">
        <button class="btn-action text-base px-8 py-3" id="nextBtn" style="display: none;" onclick="handleNextQuestion()">
          Next Question ➔
        </button>
      </div>

      <!-- Result Screen -->
      <div class="text-center py-4" id="resultScreen" style="display: none;">
        <h2 class="text-3xl font-bold text-slate-900 mb-2">🎉 Quest Completed! 🎉</h2>
        <div class="text-5xl font-extrabold text-amber-600 my-4" id="finalScore">0 / 10</div>
        <p class="text-lg text-slate-600 mb-6" id="scoreSummary">Great effort completing your Python fundamentals quest!</p>

        <!-- Handwritten Feedback Note -->
        <div class="handwritten-note">
          <div class="note-content" id="handwrittenNoteText"></div>
        </div>

        <div class="flex justify-center gap-4 flex-wrap mt-6">
          <button class="btn-action" onclick="startQuiz()">🔄 Retake Quest</button>
          <button class="btn-action" style="background: linear-gradient(135deg, #3b82f6, #1d4ed8);" onclick="showHomeScreen()">🏠 Back to Home</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    const questionsData = [
      // Q1: Click on the correct datatypes (Multi-Select)
      {
        id: 1,
        type: "MULTI_SELECT",
        question: "1. Click on all the correct standard Python data types:",
        options: [
          { text: "integer", isCorrect: true, exp: "Correct! 'integer' (int) is a fundamental built-in Python data type for whole numbers." },
          { text: "float", isCorrect: true, exp: "Correct! 'float' is the standard Python data type for decimal numbers." },
          { text: "boolean", isCorrect: true, exp: "Correct! 'boolean' (bool) represents True or False logic in Python." },
          { text: "string", isCorrect: true, exp: "Correct! 'string' (str) stores text characters in Python." },
          { text: "number", isCorrect: false, exp: "Incorrect! 'number' is a general word, not a specific Python data type name (Python uses int, float, complex)." },
          { text: "fraction", isCorrect: false, exp: "Incorrect! 'fraction' is not a basic built-in data type name in Python." },
          { text: "true", isCorrect: false, exp: "Incorrect! 'true' is a value, not a data type name (and in Python it must be capitalized as True)." },
          { text: "text", isCorrect: false, exp: "Incorrect! 'text' is not a data type name in Python; text is called 'string' or 'str'." }
        ]
      },

      // Q2: num = "2" True/False
      {
        id: 2,
        type: "TRUE_FALSE",
        question: "2. State True or False: In the statement num = \"2\", the value stored in the variable is a number.",
        code: `num = "2"`,
        options: [
          { text: "True", isCorrect: false, exp: "Incorrect! Because \"2\" is inside quotation marks, Python treats it as text (string), not a number!" },
          { text: "False", isCorrect: true, exp: "Correct! Quotation marks make \"2\" a string (text). To store it as a number, write: num = 2 without quotes." }
        ]
      },

      // Q3: Pick correct variable names (Multi-Select, 7 options)
      {
        id: 3,
        type: "MULTI_SELECT",
        question: "3. Pick all the valid and correct variable names in Python:",
        options: [
          { text: "number", isCorrect: true, exp: "Correct! 'number' uses only letters and is a perfectly valid variable name." },
          { text: "name", isCorrect: true, exp: "Correct! 'name' is a completely valid variable name." },
          { text: "num12", isCorrect: true, exp: "Correct! 'num12' is valid because numbers are allowed after letters." },
          { text: "my_name", isCorrect: true, exp: "Correct! 'my_name' is valid because underscores are allowed in variable names." },
          { text: "print", isCorrect: false, exp: "Incorrect! 'print' is a built-in Python function name! Using it as a variable name overwrites the function." },
          { text: "first number", isCorrect: false, exp: "Incorrect! 'first number' contains a space. Python variable names cannot contain spaces." },
          { text: "1num", isCorrect: false, exp: "Incorrect! '1num' starts with a number. Python variable names CANNOT start with digits." }
        ]
      },

      // Q4: \n new line True/False
      {
        id: 4,
        type: "TRUE_FALSE",
        question: "4. State True or False: \\n is used in Python strings to create a new line.",
        code: `print("Hello\\nWorld")`,
        options: [
          { text: "True", isCorrect: true, exp: "Correct! \\n is the newline escape character in Python that breaks text onto a new line." },
          { text: "False", isCorrect: false, exp: "Incorrect! \\n IS the standard newline character in Python strings." }
        ]
      },

      // Q5: Print(location) showing error
      {
        id: 5,
        type: "SINGLE_CHOICE",
        question: "5. Why is Print(location) showing an error when executed?",
        code: `location = "Singapore"\nPrint(location)`,
        options: [
          { text: "print should be written in lowercase (print)", isCorrect: true, exp: "Correct! Python is case-sensitive, so built-in functions like print() must always be in lowercase." },
          { text: "location must be inside double quotes inside Print()", isCorrect: false, exp: "Incorrect! Putting 'location' in quotes would print the word 'location' instead of the variable value Kolkata." },
          { text: "Python statements must end with a semicolon ;", isCorrect: false, exp: "Incorrect! Python does not require semicolons at the end of lines." },
          { text: "Variables containing text cannot be printed", isCorrect: false, exp: "Incorrect! Variables holding text strings can easily be printed using print()." }
        ]
      },

      // Q6: "input" valid variable name True/False
      {
        id: 6,
        type: "TRUE_FALSE",
        question: "6. State True or False: \"input\" is a valid variable name to use in Python.",
        code: `input = "User Data"`,
        options: [
          { text: "False", isCorrect: true, exp: "Correct! 'input' is a reserved built-in function in Python. Using it as a variable name breaks input()." },
          { text: "True", isCorrect: false, exp: "Incorrect! Using 'input' as a variable name overwrites Python's built-in input() function." }
        ]
      },

      // Q7: Syntax error in print statement
      {
        id: 7,
        type: "SINGLE_CHOICE",
        question: "7. Why is the following statement showing a syntax error?",
        code: `color = "blue"\nprint(" I love,"color,"color)`,
        options: [
          { text: "Quotes are broken/unclosed; the correct statement is print(\"I love\", color, \"color\")", isCorrect: true, exp: "Correct! Quotes must properly wrap text strings. The correct code is: print(\"I love\", color, \"color\")." },
          { text: "Variables cannot be used inside print statements", isCorrect: false, exp: "Incorrect! Variables are frequently used and printed inside print() statements." },
          { text: "The variable 'color' must be in capital letters", isCorrect: false, exp: "Incorrect! Variable names must simply match the exact casing used when defined." },
          { text: "Text strings must use single quotes only", isCorrect: false, exp: "Incorrect! Python supports both single ('') and double (\"\") quotes." }
        ]
      },

      // Q8: f-string variable printing issue
      {
        id: 8,
        type: "SINGLE_CHOICE",
        question: "8. Why is the following statement NOT printing the variable value 'Dog'?",
        code: `animal = "Dog"\nprint(f"animal is man's best friend")`,
        options: [
          { text: "The variable is missing curly braces {}; correct code is print(f\"{animal} is man's best friend\")", isCorrect: true, exp: "Correct! In Python f-strings, variables must be inside curly braces {animal} to print their stored values." },
          { text: "f-strings are not allowed to use double quotes", isCorrect: false, exp: "Incorrect! Double quotes work completely fine with f-strings." },
          { text: "The variable 'animal' must be converted to a number first", isCorrect: false, exp: "Incorrect! 'animal' is a text string, no conversion is needed." },
          { text: "You cannot place variables inside f-strings", isCorrect: false, exp: "Incorrect! f-strings are specifically built to embed variables easily." }
        ]
      },

      // Q9: Store thirty one in variable number data type
      {
        id: 9,
        type: "SINGLE_CHOICE",
        question: "9. I want to store the value thirty one (31) in the variable number. What is its data type?",
        code: `number = 31`,
        options: [
          { text: "integer", isCorrect: true, exp: "Correct! Whole numbers without decimal points like 31 belong to the integer (int) data type." },
          { text: "string", isCorrect: false, exp: "Incorrect! string is for text in quotes like '31', but 31 without quotes is a numeric integer." },
          { text: "float", isCorrect: false, exp: "Incorrect! float is for decimal numbers like 31.0." },
          { text: "boolean", isCorrect: false, exp: "Incorrect! boolean is only True or False." }
        ]
      },

      // Q10: Code wrong day:"Thursday"
      {
        id: 10,
        type: "SINGLE_CHOICE",
        question: "10. Why is this code wrong: day:\"Thursday\", where 'day' is intended to be a variable holding the day name?",
        code: `day:"Thursday"`,
        options: [
          { text: "Variables store values using the equals sign = (day = \"Thursday\"), not a colon :", isCorrect: true, exp: "Correct! In Python, variable assignment requires the equals sign '=' (day = \"Thursday\")." },
          { text: "Variable names must always be enclosed in double quotes", isCorrect: false, exp: "Incorrect! Variable names must NOT be enclosed in quotes." },
          { text: "Days of the week cannot be stored as text strings", isCorrect: false, exp: "Incorrect! Any text can be stored inside a string variable." },
          { text: "Colons can only be placed inside print statements", isCorrect: false, exp: "Incorrect! Colons are used for blocks and dictionaries, but never for variable assignment." }
        ]
      }
    ];

    let currentQIndex = 0;
    let score = 0;
    let timerSeconds = 30;
    let timerInterval = null;
    let answeredCurrent = false;
    let selectedIndices = new Set();
    let currentOptions = [];

    // --- CANVAS FLOWER ANIMATION ---
    const canvas = document.getElementById('flowerCanvas');
    const ctx = canvas.getContext('2d');
    let flowers = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const flowerColors = ['#f43f5e', '#ec4899', '#d946ef', '#a855f7', '#3b82f6', '#10b981', '#f59e0b'];

    class FallingFlower {
      constructor() {
        this.reset();
        this.y = Math.random() * canvas.height;
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = -30;
        this.size = Math.random() * 12 + 10;
        this.speedY = Math.random() * 1.2 + 0.6;
        this.speedRot = (Math.random() - 0.5) * 0.04;
        this.rotation = Math.random() * Math.PI * 2;
        this.color = flowerColors[Math.floor(Math.random() * flowerColors.length)];
        this.petals = 5;
      }

      update() {
        this.y += this.speedY;
        this.rotation += this.speedRot;
        if (this.y > canvas.height + 40) {
          this.reset();
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = 0.65;

        // Draw Petals
        ctx.fillStyle = this.color;
        for (let i = 0; i < this.petals; i++) {
          const angle = (i * 2 * Math.PI) / this.petals;
          ctx.beginPath();
          ctx.arc(
            Math.cos(angle) * (this.size * 0.5),
            Math.sin(angle) * (this.size * 0.5),
            this.size * 0.45,
            0,
            Math.PI * 2
          );
          ctx.fill();
        }

        // Draw Center Core
        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.arc(0, 0, this.size * 0.3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    for (let i = 0; i < 30; i++) {
      flowers.push(new FallingFlower());
    }

    function animateFlowers() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      flowers.forEach(f => {
        f.update();
        f.draw();
      });
      requestAnimationFrame(animateFlowers);
    }
    animateFlowers();

    // --- QUIZ ENGINE FUNCTIONS ---

    function loadQuestion() {
      answeredCurrent = false;
      selectedIndices.clear();
      clearInterval(timerInterval);
      timerSeconds = 30;
      updateTimerDisplay();

      const q = questionsData[currentQIndex];

      document.getElementById('qCounter').innerText = `Q ${currentQIndex + 1} / 10`;
      
      const progressPercent = ((currentQIndex) / 10) * 100;
      document.getElementById('progressBar').style.width = `${progressPercent}%`;

      // Set Type Badges & Instructions
      const qTypeBadge = document.getElementById('qTypeBadge');
      const instructionText = document.getElementById('instructionText');
      const multiSubmitContainer = document.getElementById('multiSubmitContainer');
      const submitMultiBtn = document.getElementById('submitMultiBtn');
      
      // Reset submit button state
      submitMultiBtn.disabled = false;

      if (q.type === 'MULTI_SELECT') {
        qTypeBadge.innerText = '☑️ MULTI-SELECT QUESTION';
        instructionText.innerText = 'Click on all correct choices, then press "Submit Selections":';
        multiSubmitContainer.style.display = 'flex';
      } else if (q.type === 'TRUE_FALSE') {
        qTypeBadge.innerText = '⚡ TRUE OR FALSE';
        instructionText.innerText = 'Select True or False:';
        multiSubmitContainer.style.display = 'none';
      } else {
        qTypeBadge.innerText = '💡 MULTIPLE CHOICE';
        instructionText.innerText = 'Select the one correct answer:';
        multiSubmitContainer.style.display = 'none';
      }

      document.getElementById('questionText').innerText = q.question;

      // Code Container
      const codeContainer = document.getElementById('codeContainer');
      if (q.code) {
        codeContainer.innerHTML = `<pre class="code-box"><code>${escapeHTML(q.code)}</code></pre>`;
      } else {
        codeContainer.innerHTML = '';
      }

      // Options Grid Render
      const optionsGrid = document.getElementById('optionsGrid');
      optionsGrid.innerHTML = '';
      
      if (q.type === 'TRUE_FALSE') {
        currentOptions = [...q.options];
      } else {
        // Dynamic shuffle for choices
        currentOptions = [...q.options].sort(() => Math.random() - 0.5);
      }

      currentOptions.forEach((opt, idx) => {
        const itemWrapper = document.createElement('div');
        itemWrapper.className = 'option-item';

        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.id = `optBtn_${idx}`;
        btn.innerHTML = `<span>${escapeHTML(opt.text)}</span> <span class="status-icon" id="status_${idx}"></span>`;
        btn.onclick = () => handleOptionClick(idx);

        const expDiv = document.createElement('div');
        expDiv.className = 'btn-explanation';
        expDiv.id = `expDiv_${idx}`;

        itemWrapper.appendChild(btn);
        itemWrapper.appendChild(expDiv);
        optionsGrid.appendChild(itemWrapper);
      });

      document.getElementById('nextBtn').style.display = 'none';

      // 30-Second Countdown Timer
      timerInterval = setInterval(() => {
        timerSeconds--;
        updateTimerDisplay();
        if (timerSeconds <= 0) {
          clearInterval(timerInterval);
          handleTimeOut();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const badge = document.getElementById('timerBadge');
      badge.innerText = `⏱️ ${timerSeconds}s`;
      if (timerSeconds <= 8) {
        badge.style.backgroundColor = '#fee2e2';
        badge.style.color = '#dc2626';
      } else {
        badge.style.backgroundColor = '#fef9c3';
        badge.style.color = '#854d0e';
      }
    }

    function handleOptionClick(index) {
      if (answeredCurrent) return;
      const q = questionsData[currentQIndex];

      if (q.type === 'MULTI_SELECT') {
        // Toggle selection for multi-select
        const btn = document.getElementById(`optBtn_${index}`);
        if (selectedIndices.has(index)) {
          selectedIndices.delete(index);
          btn.classList.remove('selected');
        } else {
          selectedIndices.add(index);
          btn.classList.add('selected');
        }
      } else {
        // Single choice or T/F immediate submit
        evaluateSingleChoice(index);
      }
    }

    function evaluateSingleChoice(selectedIndex) {
      answeredCurrent = true;
      clearInterval(timerInterval);

      const q = questionsData[currentQIndex];
      const selectedOpt = currentOptions[selectedIndex];

      // Disable all buttons
      currentOptions.forEach((_, i) => {
        const btn = document.getElementById(`optBtn_${i}`);
        if (btn) btn.disabled = true;
      });

      const isCorrect = selectedOpt.isCorrect;

      if (isCorrect) {
        score++;
      }

      // Display explanations directly under buttons
      currentOptions.forEach((opt, i) => {
        const btn = document.getElementById(`optBtn_${i}`);
        const statusSpan = document.getElementById(`status_${i}`);
        const expDiv = document.getElementById(`expDiv_${i}`);

        if (i === selectedIndex) {
          if (opt.isCorrect) {
            btn.classList.add('correct');
            statusSpan.innerText = '✅';
            expDiv.className = 'btn-explanation correct-exp';
            expDiv.innerHTML = `<strong>✅ Correct:</strong> ${opt.exp}`;
          } else {
            btn.classList.add('incorrect');
            statusSpan.innerText = '❌';
            expDiv.className = 'btn-explanation incorrect-exp';
            expDiv.innerHTML = `<strong>❌ Why this choice is incorrect:</strong> ${opt.exp}`;
          }
          expDiv.style.display = 'block';
        } else if (opt.isCorrect) {
          // Highlight correct answer if user picked wrong
          btn.classList.add('correct');
          statusSpan.innerText = '💡 Correct Answer';
          expDiv.className = 'btn-explanation correct-exp';
          expDiv.innerHTML = `<strong>💡 Correct Answer Explanation:</strong> ${opt.exp}`;
          expDiv.style.display = 'block';
        }
      });

      document.getElementById('nextBtn').style.display = 'inline-flex';
    }

    function submitMultiAnswer() {
      if (answeredCurrent) return;
      answeredCurrent = true;
      clearInterval(timerInterval);

      const q = questionsData[currentQIndex];

      // Disable all buttons and hide multi-select submit container
      currentOptions.forEach((_, i) => {
        const btn = document.getElementById(`optBtn_${i}`);
        if (btn) btn.disabled = true;
      });
      
      const submitBtn = document.getElementById('submitMultiBtn');
      if (submitBtn) submitBtn.disabled = true;

      let allCorrect = true;

      currentOptions.forEach((opt, idx) => {
        const isSelected = selectedIndices.has(idx);
        const btn = document.getElementById(`optBtn_${idx}`);
        const statusSpan = document.getElementById(`status_${idx}`);
        const expDiv = document.getElementById(`expDiv_${idx}`);

        if (opt.isCorrect && isSelected) {
          btn.classList.add('correct');
          statusSpan.innerText = '✅';
          expDiv.className = 'btn-explanation correct-exp';
          expDiv.innerHTML = `<strong>✅ Correct Selection:</strong> ${opt.exp}`;
          expDiv.style.display = 'block';
        } else if (opt.isCorrect && !isSelected) {
          allCorrect = false;
          btn.classList.add('missed');
          statusSpan.innerText = '⚠️ Missed Choice';
          expDiv.className = 'btn-explanation missed-exp';
          expDiv.innerHTML = `<strong>⚠️ Missed Option:</strong> ${opt.exp}`;
          expDiv.style.display = 'block';
        } else if (!opt.isCorrect && isSelected) {
          allCorrect = false;
          btn.classList.add('incorrect');
          statusSpan.innerText = '❌ Incorrect';
          expDiv.className = 'btn-explanation incorrect-exp';
          expDiv.innerHTML = `<strong>❌ Incorrect Selection:</strong> ${opt.exp}`;
          expDiv.style.display = 'block';
        }
      });

      if (allCorrect) {
        score++;
      }

      // Hide multi-select submit button after submitting answer
      document.getElementById('multiSubmitContainer').style.display = 'none';

      document.getElementById('nextBtn').style.display = 'inline-flex';
    }

    function handleTimeOut() {
      if (answeredCurrent) return;
      answeredCurrent = true;

      const q = questionsData[currentQIndex];

      currentOptions.forEach((opt, i) => {
        const btn = document.getElementById(`optBtn_${i}`);
        const statusSpan = document.getElementById(`status_${i}`);
        const expDiv = document.getElementById(`expDiv_${i}`);
        if (btn) btn.disabled = true;

        if (opt.isCorrect) {
          btn.classList.add('correct');
          statusSpan.innerText = '💡 Correct Answer';
          expDiv.className = 'btn-explanation correct-exp';
          expDiv.innerHTML = `<strong>💡 Correct Answer Explanation:</strong> ${opt.exp}`;
          expDiv.style.display = 'block';
        }
      });

      document.getElementById('multiSubmitContainer').style.display = 'none';
      document.getElementById('nextBtn').style.display = 'inline-flex';
    }

    function handleNextQuestion() {
      currentQIndex++;
      if (currentQIndex < questionsData.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById('questionContainer').style.display = 'none';
      document.getElementById('quizHeader').style.display = 'none';
      document.getElementById('progressBarBg').style.display = 'none';
      document.getElementById('multiSubmitContainer').style.display = 'none';
      document.getElementById('controlsContainer').style.display = 'none';

      const resultScreen = document.getElementById('resultScreen');
      resultScreen.style.display = 'block';

      document.getElementById('finalScore').innerText = `${score} / 10 Points`;

      let summaryMsg = "";
      if (score >= 9) {
        summaryMsg = "🏆 Outstanding! You have mastered Python core fundamentals!";
      } else if (score >= 7) {
        summaryMsg = "🚀 Fantastic job! You have a super solid grasp of variables and syntax!";
      } else if (score >= 5) {
        summaryMsg = "👍 Good effort! Practice syntax details and variable rules to level up.";
      } else {
        summaryMsg = "💪 Great start! Coding takes practice. Keep building your Python skills!";
      }
      document.getElementById('scoreSummary').innerText = summaryMsg;

      // Personalized Handwritten Sign-off Note
      const noteHtml = `
        Dear Learner,<br><br>
        Congratulations on completing all 10 questions in your Python Revision Quiz! You worked through data types, variable naming rules, code formatting bugs, and print statements.<br><br>
        <strong>Your Score: ${score} out of 10 Points!</strong><br><br>
        Every error you catch makes you a smarter programmer. Keep practicing, keep writing Python code, and stay curious!<br><br>
        Warm regards,<br>
        <strong>~ Tutor Priyadarshini ✍️</strong>
      `;
      document.getElementById('handwrittenNoteText').innerHTML = noteHtml;
    }

    function showHomeScreen() {
      clearInterval(timerInterval);
      document.getElementById('homeScreen').style.display = 'block';
      document.getElementById('quizHeader').style.display = 'none';
      document.getElementById('progressBarBg').style.display = 'none';
      document.getElementById('questionContainer').style.display = 'none';
      document.getElementById('multiSubmitContainer').style.display = 'none';
      document.getElementById('controlsContainer').style.display = 'none';
      document.getElementById('resultScreen').style.display = 'none';
    }

    function startQuiz() {
      currentQIndex = 0;
      score = 0;
      document.getElementById('homeScreen').style.display = 'none';
      document.getElementById('quizHeader').style.display = 'flex';
      document.getElementById('progressBarBg').style.display = 'block';
      document.getElementById('questionContainer').style.display = 'block';
      document.getElementById('controlsContainer').style.display = 'flex';
      document.getElementById('resultScreen').style.display = 'none';
      loadQuestion();
    }

    function escapeHTML(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Load initial home page view
    showHomeScreen();
  </script>
</body>
</html>
