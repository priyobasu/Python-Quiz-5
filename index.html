    const STORAGE_KEY = "alphagen_py_app";
    let state = { completed: {}, submissions: {} };

    function loadState() {
      try {
        const s = localStorage.getItem(STORAGE_KEY);
        if (s) state = JSON.parse(s);
      } catch(e) {}
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch(e) {}
      updateHeaderProgress();
      checkLevelStatus();
    }

    function resetProgress() {
      state = { completed: {}, submissions: {} };
      saveState();
      renderCurriculum();
      notify("Progress reset");
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function highlightPython(code) {
      if (!code) return "";
      
      const keywords = new Set(['def', 'return', 'if', 'elif', 'else', 'while', 'for', 'in', 'and', 'or', 'not', 'try', 'except', 'True', 'False', 'None']);
      const builtins = new Set(['print', 'input', 'int', 'float', 'str', 'len', 'range', 'list', 'dict', 'tuple', 'sum', 'append', 'get', 'remove', 'sort']);
      
      return code.split('\n').map(line => {
        let commentPart = "";
        let codePart = line;
        
        // Separate comment safely first so it doesn't get tokenized
        const commentIdx = line.indexOf('#');
        if (commentIdx !== -1) {
          codePart = line.slice(0, commentIdx);
          commentPart = '<span class="token-comment">' + escapeHtml(line.slice(commentIdx)) + '</span>';
        }
        
        // Tokenizer regex matching strings, identifiers, numbers, operators, whitespace
        const tokenRegex = /("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b\d+(?:\.\d+)?\b|[a-zA-Z_]\w*|==|!=|<=|>=|\/\/|\*\*|[+\-*\/%<>=]|\s+|[^\s\w]+)/g;
        
        const highlighted = codePart.replace(tokenRegex, (token) => {
          if (token.startsWith('"') || token.startsWith("'")) {
            return '<span class="token-string">' + escapeHtml(token) + '</span>';
          }
          if (keywords.has(token)) {
            return '<span class="token-keyword">' + token + '</span>';
          }
          if (builtins.has(token)) {
            return '<span class="token-builtin">' + token + '</span>';
          }
          if (/^\d+(\.\d+)?$/.test(token)) {
            return '<span class="token-number">' + token + '</span>';
          }
          if (/^(==|!=|<=|>=|\/\/|\*\*|[+\-*\/%<>=])$/.test(token)) {
            return '<span class="token-operator">' + escapeHtml(token) + '</span>';
          }
          return escapeHtml(token);
        });
        
        return highlighted + commentPart;
      }).join('\n');
    }

    function renderCurriculum() {
      const container = document.getElementById('curriculumContainer');
      container.innerHTML = "";

      CURRICULUM.forEach(level => {
        const isLevelComplete = level.challenges.every(c => state.completed[c.id]);

        const section = document.createElement('section');
        section.id = level.id;
        section.className = "scroll-mt-24 space-y-4";

        const challengesHTML = level.challenges.map(c => {
          const checked = !!state.completed[c.id];
          const hasSubmission = !!state.submissions[c.id];
          const userCode = state.submissions[c.id] || "";

          return `
            <div id="card_${c.id}" class="rounded-xl border ${checked ? 'border-brand-purpleMid bg-brand-purpleGhost' : 'border-brand-lightGrey bg-white'} p-4 sm:p-5 transition shadow-sm">
              <div class="flex items-start justify-between gap-3">
                <div class="flex items-start gap-3">
                  <label class="pt-0.5 cursor-pointer">
                    <input type="checkbox" class="sr-only peer" ${checked ? 'checked' : ''} onchange="toggleCheck('${c.id}', '${level.id}', this.checked)">
                    <div class="w-5 h-5 rounded-md border-2 border-brand-midGrey peer-checked:border-brand-purple peer-checked:bg-brand-purple flex items-center justify-center transition">
                      <i class="fa-solid fa-check text-white text-[10px] ${checked ? 'block' : 'hidden'}"></i>
                    </div>
                  </label>
                  <div>
                    <h3 class="text-sm font-bold ${checked ? 'line-through text-brand-midGrey' : 'text-brand-nearBlack'}" id="title_${c.id}">${c.title}</h3>
                    <div class="mt-1 text-xs text-brand-darkGrey leading-relaxed">${c.desc}</div>
                  </div>
                </div>

                <button onclick="toggleHelp('${c.id}')" class="flex-shrink-0 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition ${hasSubmission ? 'bg-brand-purple text-white hover:bg-brand-purpleDark' : 'bg-brand-yellow text-brand-nearBlack hover:bg-brand-yellowDark'}">
                  <span>✦</span>
                  <span>${hasSubmission ? 'Compare' : 'Need Help?'}</span>
                </button>
              </div>

              <!-- SIDE-BY-SIDE CODE COMPARATOR -->
              <div id="help_${c.id}" class="${hasSubmission ? 'block' : 'hidden'} mt-4 pt-4 border-t border-brand-lightGrey">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-3 text-xs">
                  
                  <!-- Left: Student input & formatted review -->
                  <div class="flex flex-col bg-brand-purpleGhost/50 rounded-lg border border-brand-lightGrey p-3">
                    <div class="flex items-center justify-between font-semibold text-brand-nearBlack mb-2">
                      <span>Your Code</span>
                      <button onclick="submitCode('${c.id}')" class="px-3 py-1 bg-brand-purple hover:bg-brand-purpleDark text-white font-semibold rounded text-xs transition">
                        Submit
                      </button>
                    </div>
                    <textarea id="input_${c.id}" placeholder="# Paste your Python code here..." class="w-full h-36 p-2 font-mono text-xs rounded border border-brand-lightGrey bg-white text-brand-nearBlack resize-none focus:outline-none focus:border-brand-purple">${userCode}</textarea>
                    
                    <div id="previewWrap_${c.id}" class="${userCode ? 'block' : 'hidden'} mt-2">
                      <div class="text-[10px] uppercase font-bold text-brand-midGrey mb-1">Syntax View</div>
                      <pre id="preview_${c.id}" class="font-mono text-xs p-2 rounded bg-white border border-brand-lightGrey overflow-x-auto">${highlightPython(userCode)}</pre>
                    </div>
                  </div>

                  <!-- Right: Target reference solution -->
                  <div class="flex flex-col bg-white rounded-lg border border-brand-lightGrey p-3 relative">
                    <div class="flex items-center justify-between font-semibold text-brand-purpleDark mb-2">
                      <span>Solution</span>
                      <button onclick="copySolution('${c.id}')" class="text-brand-purple hover:underline text-[11px] font-semibold">Copy</button>
                    </div>

                    <!-- Locked placeholder -->
                    <div id="lock_${c.id}" class="${hasSubmission ? 'hidden' : 'flex'} flex-col items-center justify-center p-6 text-center h-36 bg-brand-purpleGhost rounded border border-dashed border-brand-purplePale">
                      <span class="text-brand-purple font-bold text-sm mb-1">✦</span>
                      <span class="text-xs text-brand-darkGrey">Paste code and click Submit to compare.</span>
                    </div>

                    <!-- Solution display -->
                    <div id="sol_${c.id}" class="${hasSubmission ? 'block' : 'hidden'}">
                      <pre class="font-mono text-xs p-2.5 rounded bg-brand-purpleGhost border border-brand-purplePale overflow-x-auto whitespace-pre leading-relaxed">${highlightPython(c.solution)}</pre>
                    </div>
                  </div>

                </div>
              </div>
            </div>
          `;
        }).join('');

        const anecdoteHTML = `
          <div id="anecdote_${level.id}" class="${isLevelComplete ? 'block' : 'hidden'} rounded-xl bg-brand-purplePale border-l-4 border-brand-purple p-4 text-xs">
            <div class="flex items-center gap-1.5 font-bold text-brand-nearBlack mb-1">
              <span class="text-brand-purple font-bold">✦</span>
              <span>${level.anecdote.title}</span>
            </div>
            <p class="text-brand-darkGrey italic mb-3">"${level.anecdote.quote}"</p>
            <ul class="space-y-1">
              ${level.anecdote.bullets.map(b => `
                <li class="flex items-start gap-1.5 bg-white/70 p-2 rounded border border-brand-purplePale/60">
                  <span class="text-brand-purple font-bold">✦</span>
                  <span class="leading-relaxed">${b}</span>
                </li>
              `).join('')}
            </ul>
          </div>
        `;

        section.innerHTML = `
          <div class="flex items-center justify-between border-b border-brand-lightGrey pb-2">
            <h2 class="text-sm font-bold text-brand-nearBlack">${level.title}</h2>
            <span id="badge_${level.id}" class="text-[11px] font-semibold px-2 py-0.5 rounded ${isLevelComplete ? 'bg-brand-purple text-white' : 'bg-brand-lightGrey text-brand-darkGrey'}">
              ${isLevelComplete ? 'Done ✦' : `${getCompletedInLevel(level.id)} / ${level.challenges.length}`}
            </span>
          </div>
          <div class="space-y-3">
            ${challengesHTML}
          </div>
          ${anecdoteHTML}
        `;

        container.appendChild(section);
      });
    }

    function getCompletedInLevel(levelId) {
      const level = CURRICULUM.find(l => l.id === levelId);
      if (!level) return 0;
      return level.challenges.filter(c => state.completed[c.id]).length;
    }

    function toggleCheck(challengeId, levelId, isChecked) {
      if (isChecked) {
        state.completed[challengeId] = true;
        notify("Completed");
      } else {
        delete state.completed[challengeId];
      }
      saveState();

      const card = document.getElementById(`card_${challengeId}`);
      const title = document.getElementById(`title_${challengeId}`);
      const checkIcon = card ? card.querySelector('.fa-check') : null;

      if (card && title) {
        if (isChecked) {
          card.classList.replace('border-brand-lightGrey', 'border-brand-purpleMid');
          card.classList.replace('bg-white', 'bg-brand-purpleGhost');
          title.classList.add('line-through', 'text-brand-midGrey');
          if (checkIcon) checkIcon.classList.remove('hidden');
        } else {
          card.classList.replace('border-brand-purpleMid', 'border-brand-lightGrey');
          card.classList.replace('bg-brand-purpleGhost', 'bg-white');
          title.classList.remove('line-through', 'text-brand-midGrey');
          if (checkIcon) checkIcon.classList.add('hidden');
        }
      }

      checkLevelStatus();
    }

    function checkLevelStatus() {
      CURRICULUM.forEach(level => {
        const count = getCompletedInLevel(level.id);
        const isDone = count === level.challenges.length;
        const badge = document.getElementById(`badge_${level.id}`);
        const anecdote = document.getElementById(`anecdote_${level.id}`);

        if (badge) {
          badge.textContent = isDone ? 'Done ✦' : `${count} / ${level.challenges.length}`;
          badge.className = `text-[11px] font-semibold px-2 py-0.5 rounded ${isDone ? 'bg-brand-purple text-white' : 'bg-brand-lightGrey text-brand-darkGrey'}`;
        }
        if (anecdote) {
          if (isDone) {
            anecdote.classList.remove('hidden');
            anecdote.classList.add('block');
          } else {
            anecdote.classList.add('hidden');
            anecdote.classList.remove('block');
          }
        }
      });
    }

    function toggleHelp(challengeId) {
      const box = document.getElementById(`help_${challengeId}`);
      if (!box) return;
      box.classList.toggle('hidden');
    }

    function submitCode(challengeId) {
      const input = document.getElementById(`input_${challengeId}`);
      const code = input ? input.value.trim() : "";
      if (!code) {
        notify("Please paste code first");
        return;
      }

      state.submissions[challengeId] = code;
      saveState();

      const lock = document.getElementById(`lock_${challengeId}`);
      const sol = document.getElementById(`sol_${challengeId}`);
      if (lock) lock.classList.add('hidden');
      if (sol) sol.classList.remove('hidden');

      const wrap = document.getElementById(`previewWrap_${challengeId}`);
      const pre = document.getElementById(`preview_${challengeId}`);
      if (wrap && pre) {
        pre.innerHTML = highlightPython(code);
        wrap.classList.remove('hidden');
      }

      notify("Solution unlocked ✦");
    }

    function copySolution(challengeId) {
      let solCode = "";
      for (const level of CURRICULUM) {
        const found = level.challenges.find(c => c.id === challengeId);
        if (found) { solCode = found.solution; break; }
      }
      if (!solCode) return;

      const ta = document.createElement("textarea");
      ta.value = solCode;
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        notify("Copied to clipboard");
      } catch (e) {}
      document.body.removeChild(ta);
    }

    function updateHeaderProgress() {
      let total = 0, done = 0;
      CURRICULUM.forEach(lvl => {
        total += lvl.challenges.length;
        lvl.challenges.forEach(c => {
          if (state.completed[c.id]) done++;
        });
      });
      const pct = total === 0 ? 0 : Math.round((done / total) * 100);
      const bar = document.getElementById('progressBar');
      const txt = document.getElementById('progressPercent');
      if (bar) bar.style.width = `${pct}%`;
      if (txt) txt.textContent = `${pct}%`;
    }

    function notify(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      if (!toast) return;
      toastMsg.textContent = msg;
      toast.classList.remove('translate-y-16', 'opacity-0', 'pointer-events-none');
      toast.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        toast.classList.add('translate-y-16', 'opacity-0', 'pointer-events-none');
        toast.classList.remove('translate-y-0', 'opacity-100');
      }, 2500);
    }

    window.onload = function() {
      loadState();
      renderCurriculum();
      updateHeaderProgress();
      checkLevelStatus();
    };
  </script>
</body>
</html>
