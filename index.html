<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Revise Python!</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Press+Start+2P&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #ffe4e6;
            overflow-x: hidden;
        }
        .handwritten {
            font-family: 'Architects Daughter', cursive;
        }
        .pixel-font {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8rem;
        }
        .heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #fb7185;
            image-rendering: pixelated;
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
        }
        /* Pixelated Heart Shape */
        .heart::before, .heart::after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: inherit;
        }
        .heart::before { top: -10px; left: 0; border-radius: 0; }
        .heart::after { left: 10px; top: 0; border-radius: 0; }
        
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        .score-circle {
            border: 3px solid #be123c;
            border-radius: 50% 45% 52% 48%;
            padding: 20px;
            display: inline-block;
            transform: rotate(-5deg);
        }

        .code-block {
            font-family: 'Courier New', Courier, monospace;
            background: #27272a;
            color: #f4f4f5;
            padding: 1rem;
            border-radius: 0.5rem;
            white-space: pre;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const QUESTIONS = [
            {
                id: 1,
                type: 'multi',
                text: "Click on the correct keywords for datatypes:",
                options: [
                    { text: "integer", isCorrect: true, reason: "In Python, integers are whole numbers like 5 or -10." },
                    { text: "float", isCorrect: true, reason: "Floats are numbers with decimal points like 3.14." },
                    { text: "string", isCorrect: true, reason: "Strings are bits of text inside quotes." },
                    { text: "boolean", isCorrect: true, reason: "Booleans are simple True or False values." },
                    { text: "decimal", isCorrect: false, reason: "While logical, 'decimal' isn't a basic keyword name like float." },
                    { text: "alphabet", isCorrect: false, reason: "We use 'string' for text, not 'alphabet'." }
                ],
                correctCount: 4
            },
            {
                id: 2,
                type: 'multi',
                text: "Click on the correct keywords for conditions:",
                options: [
                    { text: "if", isCorrect: true, reason: "Starts a basic logic check." },
                    { text: "if-elif", isCorrect: true, reason: "Allows you to check a second option if the first was false." },
                    { text: "if-elif-else", isCorrect: true, reason: "The full chain that handles all possibilities." },
                    { text: "check", isCorrect: false, reason: "Python uses 'if', not 'check'." },
                    { text: "when", isCorrect: false, reason: "'when' is used in other languages, but not Python conditions." },
                    { text: "otherwise", isCorrect: false, reason: "Python uses 'else' instead of 'otherwise'." }
                ],
                correctCount: 3
            },
            {
                id: 3,
                type: 'multi',
                text: "Click on the correct syntax for printing statements:",
                options: [
                    { text: 'print(a, " ", b)', isCorrect: true, reason: "Comma separation adds a space automatically." },
                    { text: 'print(f"{a} {b}")', isCorrect: true, reason: "F-strings are a modern way to format text easily." },
                    { text: 'print(a, "\\n", b)', isCorrect: true, reason: "Adding '\\n' creates a new line between the items." },
                    { text: 'print a, b', isCorrect: false, reason: "Python 3 requires parentheses () for printing." },
                    { text: 'echo(a, b)', isCorrect: false, reason: "'echo' is for shells, Python uses 'print'." },
                    { text: 'display(a, b)', isCorrect: false, reason: "While it sounds right, 'display' isn't the standard print function." }
                ],
                correctCount: 3
            },
            {
                id: 4,
                type: 'multi',
                text: "Click on the correct jumping statements:",
                options: [
                    { text: "break", isCorrect: true, reason: "Used to exit a loop completely." },
                    { text: "continue", isCorrect: true, reason: "Used to skip to the next turn of the loop." },
                    { text: "return", isCorrect: true, reason: "Used to exit a function and give back a value." },
                    { text: "skip", isCorrect: false, reason: "Python uses 'continue', not 'skip'." },
                    { text: "stop", isCorrect: false, reason: "Python uses 'break' to stop a loop." },
                    { text: "exit", isCorrect: false, reason: "'exit()' closes the program, it's not a loop jump keyword." }
                ],
                correctCount: 3
            },
            {
                id: 5,
                type: 'multi',
                text: "Click on the correct operations related to division:",
                options: [
                    { text: "/", isCorrect: true, reason: "Standard division that gives a decimal answer." },
                    { text: "%", isCorrect: true, reason: "The Modulo operator finds the remainder." },
                    { text: "//", isCorrect: true, reason: "Floor division that cuts off the decimal part." },
                    { text: "\\", isCorrect: false, reason: "Backslashes are for special characters, not math." },
                    { text: "div", isCorrect: false, reason: "Python uses symbols like / or // instead of 'div'." },
                    { text: "mod", isCorrect: false, reason: "Python uses the % symbol for modulo." }
                ],
                correctCount: 3
            },
            {
                id: 6,
                type: 'single',
                text: "What is the final value of 'a'?",
                code: "a = 3\na = a + 2\na = a % 2",
                options: [
                    { text: "1", isCorrect: true, reason: "3+2=5, and 5 divided by 2 leaves a remainder of 1." },
                    { text: "5", isCorrect: false, reason: "You missed the last step where we find the remainder (%)." },
                    { text: "0", isCorrect: false, reason: "5 is an odd number, so the remainder is 1, not 0." },
                    { text: "2", isCorrect: false, reason: "Modulo finds the remainder, not how many times it fits." },
                    { text: "3", isCorrect: false, reason: "The value changes after the addition and modulo steps." },
                    { text: "1.5", isCorrect: false, reason: "Modulo % always gives the remainder as a whole number here." }
                ]
            },
            {
                id: 7,
                type: 'single',
                text: "Mark True or False: A data structure can only hold 5 values at a time.",
                options: [
                    { text: "False", isCorrect: true, reason: "Data structures like lists can hold thousands or millions of items!" },
                    { text: "True", isCorrect: false, reason: "Actually, Python lists and dictionaries can grow as large as your computer's memory allows." }
                ]
            },
            {
                id: 8,
                type: 'single',
                text: "Mark True or False: You cannot change the values in a tuple.",
                options: [
                    { text: "True", isCorrect: true, reason: "Tuples are 'immutable', which is a fancy way of saying they are locked once created." },
                    { text: "False", isCorrect: false, reason: "Tuples are fixed. If you want a list that can change, you should use a List [ ] instead." }
                ]
            },
            {
                id: 9,
                type: 'single',
                text: "Mark True or False: 4**2 is 8.",
                options: [
                    { text: "False", isCorrect: true, reason: "** is the power operator, so 4**2 is 4 times 4, which is 16." },
                    { text: "True", isCorrect: false, reason: "Don't confuse ** with multiplication! 4*2 is 8, but 4**2 is 16." }
                ]
            },
            {
                id: 10,
                type: 'single',
                text: "Why does this code throw an error?",
                code: "while = 4\nprint(while)",
                options: [
                    { text: "'while' is a reserved keyword", isCorrect: true, reason: "'while' is a command for loops, so Python won't let you use it as a variable name." },
                    { text: "Missing quotes", isCorrect: false, reason: "The error is about the name 'while', not about strings." },
                    { text: "Cannot assign numbers to names", isCorrect: false, reason: "We can assign numbers to names, just not to 'special' keywords." },
                    { text: "Case sensitivity", isCorrect: false, reason: "While Python is case sensitive, 'while' is always a keyword in lowercase." },
                    { text: "Syntax error in print", isCorrect: false, reason: "The print function itself is written correctly here." },
                    { text: "Variables must be longer", isCorrect: false, reason: "Variable names can be just one letter long, but they can't be keywords." }
                ]
            }
        ];

        function PixelHeart() {
            const style = {
                left: Math.random() * 100 + 'vw',
                animationDuration: (Math.random() * 10 + 5) + 's',
                animationDelay: (Math.random() * 5) + 's'
            };
            return <div className="heart" style={{...style, animation: `float ${style.animationDuration} linear infinite`}}></div>;
        }

        function App() {
            const [gameState, setGameState] = useState('home'); // home, quiz, result
            const [currentQ, setCurrentQ] = useState(0);
            const [score, setScore] = useState(0);
            const [timer, setTimer] = useState(30);
            const [selectedOptions, setSelectedOptions] = useState([]);
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [hearts, setHearts] = useState([]);

            useEffect(() => {
                const newHearts = Array.from({ length: 15 }).map((_, i) => <PixelHeart key={i} />);
                setHearts(newHearts);
            }, []);

            useEffect(() => {
                let interval;
                if (gameState === 'quiz' && !isSubmitted && timer > 0) {
                    interval = setInterval(() => {
                        setTimer(prev => prev - 1);
                    }, 1000);
                } else if (timer === 0 && !isSubmitted) {
                    handleSubmit();
                }
                return () => clearInterval(interval);
            }, [gameState, timer, isSubmitted]);

            const startQuiz = () => {
                setGameState('quiz');
                setCurrentQ(0);
                setScore(0);
                resetQuestionState();
            };

            const resetQuestionState = () => {
                setTimer(30);
                setSelectedOptions([]);
                setIsSubmitted(false);
            };

            const toggleOption = (idx) => {
                if (isSubmitted) return;
                const question = QUESTIONS[currentQ];
                if (question.type === 'single') {
                    setSelectedOptions([idx]);
                } else {
                    setSelectedOptions(prev => 
                        prev.includes(idx) ? prev.filter(i => i !== idx) : [...prev, idx]
                    );
                }
            };

            const handleSubmit = () => {
                if (isSubmitted) return;
                setIsSubmitted(true);
                
                const question = QUESTIONS[currentQ];
                const correctIndices = question.options
                    .map((opt, i) => opt.isCorrect ? i : null)
                    .filter(i => i !== null);

                let isCorrect = false;
                if (question.type === 'single') {
                    isCorrect = selectedOptions.length === 1 && correctIndices.includes(selectedOptions[0]);
                } else {
                    const sortedSelected = [...selectedOptions].sort();
                    const sortedCorrect = [...correctIndices].sort();
                    isCorrect = JSON.stringify(sortedSelected) === JSON.stringify(sortedCorrect);
                }

                if (isCorrect) setScore(prev => prev + 1);
            };

            const nextQuestion = () => {
                if (currentQ < QUESTIONS.length - 1) {
                    setCurrentQ(prev => prev + 1);
                    resetQuestionState();
                } else {
                    setGameState('result');
                }
            };

            const getQuote = () => {
                if (score === 10) return "Master of Python! You're absolutely amazing!";
                if (score >= 6) return "Great job! You really know your stuff. Keep it up!";
                return "Good start! Coding is a journey, and you're doing great. Keep practicing!";
            };

            const shuffledOptions = useRef([]);
            useEffect(() => {
                if (gameState === 'quiz') {
                    const optionsWithOriginalIndex = QUESTIONS[currentQ].options.map((opt, idx) => ({...opt, originalIdx: idx}));
                    shuffledOptions.current = optionsWithOriginalIndex.sort(() => Math.random() - 0.5);
                }
            }, [currentQ, gameState]);

            return (
                <div className="min-h-screen relative flex items-center justify-center p-4">
                    {hearts}
                    
                    <div className="relative z-10 w-full max-w-2xl bg-white/90 backdrop-blur-sm rounded-3xl shadow-xl p-8 border-4 border-pink-300">
                        {gameState === 'home' && (
                            <div className="text-center space-y-8">
                                <h1 className="text-4xl font-bold text-pink-600">Let's Revise Python! 🐍</h1>
                                <p className="text-lg text-gray-700">Ready to test your coding skills? You have 30 seconds per question!</p>
                                <button 
                                    onClick={startQuiz}
                                    className="bg-pink-500 hover:bg-pink-600 text-white font-bold py-4 px-10 rounded-full transition-all transform hover:scale-105 shadow-lg text-xl"
                                >
                                    Start Learning!
                                </button>
                            </div>
                        )}

                        {gameState === 'quiz' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center">
                                    <span className="bg-pink-100 text-pink-600 px-4 py-1 rounded-full font-bold">Question {currentQ + 1}/{QUESTIONS.length}</span>
                                    <span className={`text-xl font-bold flex items-center gap-2 ${timer < 10 ? 'text-red-500 animate-pulse' : 'text-pink-500'}`}>
                                        ⏱️ {timer}s
                                    </span>
                                </div>

                                <div className="space-y-4">
                                    <h2 className="text-2xl font-semibold text-gray-800">{QUESTIONS[currentQ].text}</h2>
                                    
                                    {QUESTIONS[currentQ].code && (
                                        <div className="code-block text-sm">
                                            {QUESTIONS[currentQ].code}
                                        </div>
                                    )}

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        {shuffledOptions.current.map((option, i) => {
                                            const isSelected = selectedOptions.includes(option.originalIdx);
                                            let btnClass = "p-4 rounded-xl border-2 transition-all text-left flex flex-col ";
                                            
                                            if (isSubmitted) {
                                                if (option.isCorrect) {
                                                    btnClass += "border-green-500 bg-green-50 text-green-800";
                                                } else if (isSelected && !option.isCorrect) {
                                                    btnClass += "border-red-500 bg-red-50 text-red-800";
                                                } else {
                                                    btnClass += "border-gray-200 opacity-50";
                                                }
                                            } else {
                                                btnClass += isSelected 
                                                    ? "border-pink-500 bg-pink-100 text-pink-700 scale-[1.02]" 
                                                    : "border-gray-200 hover:border-pink-300 bg-white";
                                            }

                                            return (
                                                <button 
                                                    key={i}
                                                    onClick={() => toggleOption(option.originalIdx)}
                                                    className={btnClass}
                                                >
                                                    <span className="font-bold">{option.text}</span>
                                                    {isSubmitted && isSelected && (
                                                        <span className="text-xs mt-2 italic font-medium">{option.reason}</span>
                                                    )}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div className="flex justify-end pt-4">
                                    {!isSubmitted ? (
                                        <button 
                                            onClick={handleSubmit}
                                            disabled={selectedOptions.length === 0}
                                            className="bg-pink-500 hover:bg-pink-600 disabled:bg-gray-300 text-white font-bold py-2 px-8 rounded-xl transition-colors"
                                        >
                                            Submit
                                        </button>
                                    ) : (
                                        <button 
                                            onClick={nextQuestion}
                                            className="bg-pink-600 hover:bg-pink-700 text-white font-bold py-2 px-8 rounded-xl transition-colors"
                                        >
                                            {currentQ === QUESTIONS.length - 1 ? "Show Report Card" : "Next Question →"}
                                        </button>
                                    )}
                                </div>
                            </div>
                        )}

                        {gameState === 'result' && (
                            <div className="text-center space-y-8 py-4">
                                <h2 className="text-3xl font-bold text-pink-600">Your Python Report Card</h2>
                                
                                <div className="py-8">
                                    <div className="score-circle">
                                        <span className="handwritten text-6xl text-rose-700 font-bold">
                                            {score} / {QUESTIONS.length}
                                        </span>
                                    </div>
                                </div>

                                <div className="bg-pink-50 p-6 rounded-2xl border-2 border-dashed border-pink-300">
                                    <p className="handwritten text-2xl text-pink-800">
                                        "{getQuote()}"
                                    </p>
                                </div>

                                <button 
                                    onClick={() => setGameState('home')}
                                    className="bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 px-10 rounded-full transition-transform hover:scale-105"
                                >
                                    Try Again!
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
